<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Vytvořit třídu</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='python-theme.css') }}">
</head>
<body class="bg-light python-course">
{% include "python/_header.html" %}
<div class="container mt-4">
    <h2>Vytvořit novou třídu</h2>
    <a href="{{ url_for('python.teacher_dashboard') }}" class="btn btn-secondary mb-3">Zpět na dashboard</a>
    <form method="post">
        <div class="form-group">
            <label>Název třídy</label>
            <input type="text" name="name" class="form-control" required>
        </div>
        <div class="form-group">
            <label>Popis</label>
            <textarea name="description" class="form-control" rows="3"></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Vytvořit třídu</button>
    </form>
    <a href="{{ url_for('python.teacher_manage_students') }}" class="btn btn-secondary mt-3">Zpět</a>
</div>
</body>
</html>
