<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Zadané úkoly</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='python-theme.css') }}">
</head>
<body class="bg-light python-course">
{% include "python/_header.html" %}
<div class="container mt-4">
    <h2>Zadané úkoly třídám</h2>
    <a href="{{ url_for('python.teacher_dashboard') }}" class="btn btn-secondary mb-3">← Dashboard učitele</a>
    {% if rows %}
      <table class="table table-bordered">
        <thead class="thead-dark">
          <tr>
            <th>Cvičení</th>
            <th>Třída</th>
            <th>Deadline</th>
            <th>Akce</th>
          </tr>
        </thead>
        <tbody>
          {% for r in rows %}
          <tr>
            <td>
              <a href="{{ url_for('python.teacher_assignment_status', assignment_id=r.assignment_id, class_id=r.class_id) }}">
                {{ r.exercise }}
              </a>
            </td>
            <td>{{ r.class_name }}</td>
            <td>{{ r.deadline|format_datetime }}</td>
            <td>
              <!-- Editace úkolu -->
              <a href="{{ url_for('python.teacher_assigned_edit', ca_id=r.id) }}"
                   class="btn btn-sm btn-warning mb-1">
                   Upravit deadline
              </a>
              <!-- Odebrání přiřazení cvičení -->
              <form method="post"
                    action="{{ url_for('python.teacher_unassign', ca_id=r.id) }}"
                    style="display:inline;">
                <button type="submit"
                        class="btn btn-danger btn-sm"
                        onclick="return confirm('Opravdu chcete tento úkol smazat?')">
                  Smazat úkol
                </button>
              </form>
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    {% else %}
      <p>Žádné zadané úkoly.</p>
    {% endif %}
  </div>
</body>
</html>
