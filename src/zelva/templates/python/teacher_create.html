<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Vytvořit nové cvičení</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
  <!-- CodeMirror styly -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/theme/dracula.min.css">
  <!-- Lint addon styly -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/addon/lint/lint.css">
  <style>
    .CodeMirror {
      border: 1px solid #dee2e6;
      /* Nastavte vhodnou výšku pro učitelský kód – zde pevná hodnota */
      min-height: 150px;
    }
    /* Pro testovací volání necháme auto-resize, takže zde nebudeme nastavovat pevnou výšku */
  </style>
    <link rel="stylesheet" href="{{ url_for('static', filename='python-theme.css') }}">
</head>
<body class="bg-light python-course">
{% include "python/_header.html" %}
<div class="container mt-4">
    <h2>Vytvořit nové cvičení</h2>
    <a href="{{ url_for('python.teacher_dashboard') }}" class="btn btn-secondary mb-3">Zpět na dashboard</a>
    <form method="post" action="{{ url_for('python.teacher_create') }}">
      <div class="form-group">
        <label>Název cvičení</label>
        <input type="text" name="title" class="form-control" required>
      </div>
      <div class="form-group">
        <label>Popis</label>
        <textarea name="description" class="form-control" rows="3" required></textarea>
      </div>
      <div class="form-group">
        <label>Sekce</label>
        <input type="text" name="section" class="form-control" required>
      </div>
      <div class="form-group">
        <label>Pořadí cvičení (display_order)</label>
        <input type="number" name="display_order" class="form-control" value="0">
      </div>
      <div class="form-group">
        <label>Nápověda</label>
        <textarea name="help_text" class="form-control" rows="3" placeholder="Zadejte nápovědu"></textarea>
      </div>
      <div class="form-group">
        <label>Učitelský kód (funkce)</label>
        <!-- textarea zůstane, ale můžeš ho schovat pomocí CSS, vždy se ale odesílá -->
        <textarea name="teacher_code" id="teacher_code" class="form-control" style="display:none;"></textarea>
      </div>
      <div class="form-group">
        <label>Počet prvních řádků kopírovaných studentovi</label>
        <input type="number" name="precopy_lines" id="precopy_lines" class="form-control" value="1" min="0">
      </div>
      <div class="form-group">
        <label>Testovací volání pro „Spustit test“</label>
        <textarea name="test_call_run" id="test_call_run" class="form-control" rows="3" placeholder='Např.: vypis("Hello")'></textarea>
      </div>
      <div class="form-group">
        <label>Testovací volání pro „Odevzdat kód“ (oddělené středníkem)</label>
        <textarea name="test_call_submit" id="test_call_submit" class="form-control" rows="3" placeholder='Např.: vypis("Test1"); vypis("Test2")'></textarea>
      </div>
      <button type="submit" class="btn btn-primary">Vytvořit cvičení</button>
    </form>
  </div>

  <!-- Načtení CodeMirror knihoven a addonů z CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/mode/python/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/addon/lint/lint.js"></script>
  <!-- AutoResize addon (pokud je dostupný na CDN) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/addon/display/autoresize.min.js"></script>

  <script>
    // Jednoduchý linter pro Python
    CodeMirror.registerHelper("lint", "python", function(text) {
      var found = [], lines = text.split("\n");
      for (var i = 0; i < lines.length; i++) {
        var line = lines[i], indent = (line.match(/^( *)/)||[])[1].length;
        if (line.trim() !== "" && indent % 4 !== 0) {
          found.push({from: CodeMirror.Pos(i,0), to: CodeMirror.Pos(i,indent), message: "Odsazení musí být násobkem 4."});
        }
        ["'", '"'].forEach(function(q) {
          var cnt = (line.match(new RegExp("(?<!\\\\)\\"+q, "g"))||[]).length;
          if (cnt % 2 !== 0) {
            found.push({from: CodeMirror.Pos(i,line.lastIndexOf(q)), to: CodeMirror.Pos(i,line.length), message: "Neuzavřená uvozovka."});
          }
        });
        var stack = [];
        for (var j = 0; j < line.length; j++) {
          var ch = line[j];
          if ("([{".includes(ch)) stack.push({c:ch,p:j});
          if (")]}".includes(ch)) {
            if (!stack.length) {
              found.push({from: CodeMirror.Pos(i,j), to: CodeMirror.Pos(i,j+1), message: "Neočekávaná závorka: "+ch});
            } else {
              var last = stack.pop();
              if ((last.c==="("&&ch!==")")||(last.c==="["&&ch!=="]")||(last.c==="{"&&ch!=="}")) {
                found.push({from: CodeMirror.Pos(i,last.p), to: CodeMirror.Pos(i,j+1), message: "Chybné závorky."});
              }
            }
          }
        }
        while (stack.length) {
          var u = stack.pop();
          found.push({from: CodeMirror.Pos(i,u.p), to: CodeMirror.Pos(i,line.length), message: "Neuzavřená závorka."});
        }
      }
      return found;
    });

    // Initializace CodeMirror editorů
    var teacherEditor = CodeMirror.fromTextArea(document.getElementById("teacher_code"), {
      mode: "python", theme: "dracula", lineNumbers: true,
      indentUnit: 4, tabSize: 4, indentWithTabs: false,
      lint: true, gutters: ["CodeMirror-lint-markers"]
    });
    var runEditor = CodeMirror.fromTextArea(document.getElementById("test_call_run"), {
      mode: "python", theme: "dracula", lineNumbers: true,
      indentUnit: 4, tabSize: 4, indentWithTabs: false,
      lint: true, gutters: ["CodeMirror-lint-markers"], autoResize: true, viewportMargin: Infinity
    }); runEditor.setSize(null,60);
    var submitEditor = CodeMirror.fromTextArea(document.getElementById("test_call_submit"), {
      mode: "python", theme: "dracula", lineNumbers: true,
      indentUnit: 4, tabSize: 4, indentWithTabs: false,
      lint: true, gutters: ["CodeMirror-lint-markers"], autoResize: true, viewportMargin: Infinity
    }); submitEditor.setSize(null,60);
  </script>
</body>
</html>
