<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Správa nástěnky</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='python-theme.css') }}">
</head>
<body class="bg-light python-course">
{% include "python/_header.html" %}
<div class="container mt-4">
    <h2>Správa nástěnky</h2>
    <a href="{{ url_for('python.teacher_dashboard') }}" class="btn btn-secondary mb-3">← Dashboard učitele</a>
    <form method="post">
      <div class="form-group">
        <label for="class_id">Vyber třídu:</label>
        <select id="class_id" name="class_id" class="form-control mb-3" onchange="this.form.submit()">
          {% for c in classes %}
            <option value="{{ c.id }}" {% if c.id == selected_class %}selected{% endif %}>
              {{ c.name }}
            </option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label>Sekce na nástěnce:</label>
        {% for sec in sections %}
          <div class="form-check">
            <input class="form-check-input" type="checkbox" name="sections" value="{{ sec }}"
                   id="sec-{{ loop.index }}"
                   {% if sec in pinned %}checked{% endif %}>
            <label class="form-check-label" for="sec-{{ loop.index }}">{{ sec }}</label>
          </div>
        {% endfor %}
      </div>
      <button class="btn btn-primary">Uložit</button>
    </form>
  </div>
</body>
</html>
