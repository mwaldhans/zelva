<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Upravit úkol</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='python-theme.css') }}">
</head>
<body class="bg-light python-course">
{% include "python/_header.html" %}
<div class="container mt-4">
    <h2>Upravit úkol</h2>
    <a href="{{ url_for('python.teacher_assigned') }}" class="btn btn-secondary mb-3">← Zpět na přehled úkolů</a>

    <form method="post" action="{{ url_for('python.teacher_assigned_edit', ca_id=ca.id) }}">
      <div class="form-group">
        <label for="exercise">Cvičení</label>
        <input type="text" id="exercise" class="form-control" value="{{ ca.exercise }}" readonly>
      </div>

      <div class="form-group">
        <label for="class_name">Třída</label>
        <input type="text" id="class_name" class="form-control" value="{{ ca.class_name }}" readonly>
      </div>

      <div class="form-group">
        <label for="deadline">Deadline</label>
        <input type="datetime-local" id="deadline" name="deadline" class="form-control"
               value="{{ ca.deadline[:16] | replace(' ', 'T') }}" required>
      </div>

      <!-- Další vlastnosti přiřazení lze doplnit zde -->

      <button type="submit" class="btn btn-primary">Uložit změny</button>
      <a href="{{ url_for('python.teacher_assigned') }}" class="btn btn-secondary ml-2">Zrušit</a>
    </form>
  </div>

  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
